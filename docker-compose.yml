# marketplace-analytics: Postgres с данными Olist + Redash

x-redash-env: &redash-env
  REDASH_DATABASE_URL: postgresql://postgres:${REDASH_PG_PASSWORD}@redash-postgres/postgres
  REDASH_REDIS_URL: redis://redis:6379/0
  REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
  REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
  REDASH_LOG_LEVEL: INFO
  PYTHONUNBUFFERED: 0

x-redash: &redash
  image: redash/redash:10.1.0.b50633
  platform: linux/amd64        # официальный образ только amd64; на M-чипе идёт через Rosetta
  depends_on:
    - redash-postgres
    - redis
  restart: unless-stopped

services:
  # --- Аналитическая БД с данными Olist ---
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"            # 5433 снаружи, чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # --- Служебная БД Redash ---
  redash-postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_PASSWORD: ${REDASH_PG_PASSWORD}
    volumes:
      - redash_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # --- Redash ---
  server:
    <<: *redash
    command: server
    environment:
      <<: *redash-env
      REDASH_WEB_WORKERS: 2
    ports:
      - "5050:5000"            # 5000 на macOS занят AirPlay Receiver

  scheduler:
    <<: *redash
    command: scheduler
    environment:
      <<: *redash-env

  worker:
    <<: *redash
    command: worker
    environment:
      <<: *redash-env
      QUEUES: "queries,scheduled_queries,schemas,periodic,emails,default"
      WORKERS_COUNT: 2

volumes:
  pgdata:
  redash_pgdata:
